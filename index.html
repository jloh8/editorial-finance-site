<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Editorial Finance prototype — a documentary on the rise and fall of Detroit's auto industry.">
<title>Editorial Finance — How Detroit built the car, and lost the industry</title>
<style>
:root{
  --ink:#1b1712; --paper:#faf8f3; --card:#ffffff; --muted:#6f655a;
  --line:#e4dccf; --accent:#8b1e1e; --amber:#a86a12; --green:#1e6b3a; --link:#1d4e9e; --blue:#1d4e9e;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.65;font-size:17px}
h1,h2,h3,.serif{font-family:Georgia,"Times New Roman",serif;line-height:1.25}
.masthead{position:sticky;top:0;z-index:50;background:var(--ink);color:#f5f1e8;
  padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:Georgia,serif;font-size:20px;letter-spacing:.3px;display:flex;align-items:center;gap:10px}
.proto-badge{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:11px;
  background:#3a3428;color:#ffd98a;border:1px solid #6b5c3a;border-radius:20px;padding:3px 10px;
  letter-spacing:1.2px;text-transform:uppercase}
.masthead nav{margin-left:auto;display:flex;gap:8px}
.navbtn{font-size:15px;min-height:54px;padding:10px 16px;border-radius:10px;border:1px solid #4a4436;
  background:transparent;color:#f5f1e8;cursor:pointer}
.navbtn[aria-current="page"]{background:#f5f1e8;color:var(--ink)}
.qcount{display:inline-block;min-width:22px;text-align:center;background:var(--amber);color:#fff;
  border-radius:12px;font-size:13px;padding:1px 6px;margin-left:4px}
main{max-width:760px;margin:0 auto;padding:0 18px 80px}
.hero{padding:34px 0 10px;border-bottom:2px solid var(--ink)}
.kicker{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);margin:0 0 10px;font-weight:700}
.hero h1{font-size:clamp(30px,7.5vw,46px);margin:0 0 12px}
.dek{font-size:19px;color:var(--muted);margin:0 0 16px}
.byline{font-size:14px;color:var(--muted)}
.status-pill{display:inline-block;font-size:14px;font-weight:700;border-radius:20px;padding:6px 16px;margin:6px 0 12px}
.status-pill.in_review{background:#fdf3e3;color:var(--amber);border:1px solid #e3c98f}
.status-pill.published{background:#e9f5ec;color:var(--green);border:1px solid #a9d4b6}
.status-pill.needs_revision{background:#fdeaea;color:var(--accent);border:1px solid #e5a9a9}
.status-pill.revising{background:#eef3fd;color:var(--blue);border:1px solid #a9c2e8}
.status-pill.draft{background:#f4f1ea;color:var(--muted);border:1px solid var(--line)}
.figures{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:26px 0}
.fig{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px}
.fig .n{font-family:Georgia,serif;font-size:24px;font-weight:700;color:var(--accent)}
.fig .l{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.4}
.chapter{margin:34px 0}
.chapter h2{font-size:26px;margin:0 0 4px}
.chapter .chapnum{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);font-weight:700}
.chapter p{margin:14px 0}
blockquote{margin:20px 0;padding:4px 0 4px 18px;border-left:3px solid var(--accent);
  font-family:Georgia,serif;font-size:20px;font-style:italic}
blockquote cite{display:block;font-style:normal;font-size:14px;color:var(--muted);margin-top:6px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.srccite{font-size:12px;color:var(--muted);vertical-align:super}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:28px 0}
.card h2{font-size:22px;margin:0 0 6px}
.card .sub{font-size:14px;color:var(--muted);margin:0 0 12px}
svg.chart{width:100%;height:auto;display:block}
.chartnote,.footnote{font-size:13px;color:var(--muted);margin-top:10px}
.bar-row{margin:12px 0}
.bar-row .blabel{font-size:14px;font-weight:600;margin-bottom:4px}
.bar-track{background:#eee7d8;border-radius:8px;height:34px;position:relative;overflow:hidden}
.bar-fill{background:var(--accent);height:100%;border-radius:8px;display:flex;align-items:center;justify-content:flex-end;
  color:#fff;font-weight:700;font-size:14px;padding-right:10px;min-width:64px}
.bar-fill.old{background:#2e2a24}
.caveats li{margin:10px 0}
.caveats .slant{font-size:13px;color:var(--muted)}
.srclist{font-size:14px}
.srclist h3{font-size:15px;margin:18px 0 6px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.srclist ul{list-style:none;padding:0;margin:0}
.srclist li{margin:8px 0}
.srclist a{color:var(--link);word-break:break-all}
/* Admin */
.admin-head{padding:30px 0 6px}
.admin-head h1{font-size:30px;margin:0 0 6px}
.draft-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:18px 0}
.draft-card h3{margin:0 0 6px;font-size:21px}
.draft-meta{font-size:14px;color:var(--muted);margin:0 0 14px}
.actions{display:grid;gap:10px;margin-top:14px}
.abtn{min-height:54px;font-size:17px;font-weight:700;border-radius:12px;border:1px solid var(--line);
  cursor:pointer;background:#fff;color:var(--ink)}
.abtn.primary{background:var(--green);border-color:var(--green);color:#fff}
.abtn.warn{color:var(--accent);border-color:#e5a9a9}
.abtn:disabled{opacity:.45;cursor:default}
.hint{font-size:13px;color:var(--muted);margin:14px 0 0}
.revbox{margin-top:14px}
.revbox label{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
.revbox textarea,textarea.notes{width:100%;min-height:110px;font-size:16px;line-height:1.5;border:1px solid var(--line);
  border-radius:12px;padding:12px;font-family:inherit;resize:vertical;background:#fff;color:var(--ink)}
.authbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:18px 0}
.authbox label{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
.authbox input[type=email]{width:100%;min-height:54px;font-size:17px;border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;font-family:inherit;background:#fff;color:var(--ink);margin-bottom:12px}
.msg{font-size:15px;margin:12px 0;padding:12px 14px;border-radius:12px;background:#eef3fd;
  border:1px solid #a9c2e8;color:var(--ink)}
.msg.err{background:#fdeaea;border-color:#e5a9a9}
.msg.ok{background:#e9f5ec;border-color:#a9d4b6}
.preview{margin-top:16px;border-top:2px solid var(--ink);padding-top:8px}
.verlabel{display:inline-block;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:1px;margin:8px 0 0}
footer{border-top:1px solid var(--line);margin-top:50px;padding:22px 0;font-size:13px;color:var(--muted)}
.foot-inner{max-width:760px;margin:0 auto;padding:0 18px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="masthead">
  <div class="brand">Editorial Finance <span class="proto-badge">Prototype</span></div>
  <nav>
    <button class="navbtn" id="navReader" aria-current="page">Reader</button>
    <button class="navbtn" id="navAdmin">Review queue <span class="qcount" id="queueCount">0</span></button>
  </nav>
</header>

<main id="viewReader">
  <div id="readerContent"><p class="hint">Loading…</p></div>
</main>

<main id="viewAdmin" hidden>
  <section class="admin-head">
    <h1 class="serif">Review queue</h1>
    <p class="byline">Drafts awaiting an editorial decision. Approving publishes to the reader view.</p>
  </section>
  <div id="adminContent"><p class="hint">Loading…</p></div>
</main>

<footer>
  <div class="foot-inner">
    <p>Editorial Finance prototype. Public comments are intentionally omitted in this version.</p>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
"use strict";

/* ================= Config ================= */
// Supabase project: CoursideMeetup
var SUPABASE_URL = "https://cghvnuvuermiehvygwyw.supabase.co";
// Anon (public) key — Supabase dashboard → Project Settings → API → "anon public".
// The anon key is public by design (it ships in this file).
// NEVER put the service_role key here.
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNnaHZudXZ1ZXJtaWVodnlnd3l3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5MzY4NjUsImV4cCI6MjEwMzUxMjg2NX0.8sWEoxc-6b28OGtRoJ17q5h6hJ1R3Pnrk50TO1AX4F8";
var EDITOR_EMAIL = "jiajingloh@gmail.com";

var PLACEHOLDER_TITLE = "How Detroit built the car — and lost the industry";
var PLACEHOLDER_DEK = "From the Model T to the largest municipal bankruptcy in American history: a century of the Motor City, and what it says about American industry.";

var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var keyMissing = (SUPABASE_ANON_KEY === "PASTE_ANON_KEY_HERE");

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function fmtDate(ts){
  try{ return new Date(ts).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}); }
  catch(e){ return ""; }
}
function statusPill(st){
  var map = {
    published:["published","Published"],
    in_review:["in_review","In review"],
    needs_revision:["needs_revision","Needs revision"],
    revising:["revising","Revising…"],
    draft:["draft","Draft"]
  };
  var m = map[st] || map.draft;
  return '<span class="status-pill ' + m[0] + '">' + m[1] + '</span>';
}
function configNeededHtml(){
  return '<div class="card"><h2>Setup needed</h2>' +
    '<p class="sub">Paste the Supabase <strong>anon public</strong> key into index.html ' +
    '(Supabase dashboard → Project Settings → API), then republish.</p></div>';
}

/* ================= View switching ================= */
var viewReader = document.getElementById("viewReader");
var viewAdmin = document.getElementById("viewAdmin");
var navReader = document.getElementById("navReader");
var navAdmin = document.getElementById("navAdmin");

function show(view){
  var isAdmin = view === "admin";
  viewAdmin.hidden = !isAdmin;
  viewReader.hidden = isAdmin;
  navAdmin.setAttribute("aria-current", isAdmin ? "page" : "false");
  navReader.setAttribute("aria-current", isAdmin ? "false" : "page");
  window.scrollTo(0,0);
  if(isAdmin){ refreshAdmin(); } else { loadReader(); }
}
navReader.addEventListener("click", function(){ show("reader"); });
navAdmin.addEventListener("click", function(){ show("admin"); });

/* ================= Reader ================= */
async function loadReader(){
  var el = document.getElementById("readerContent");
  if(keyMissing){ el.innerHTML = configNeededHtml(); return; }
  el.innerHTML = '<p class="hint">Loading…</p>';
  try{
    var res = await sb.from("editorial_articles")
      .select("id,title,dek,status,current_version_id,updated_at")
      .eq("status","published")
      .order("updated_at",{ascending:false})
      .limit(1).maybeSingle();
    if(res.error) throw res.error;
    var art = res.data;
    if(!art || !art.current_version_id){
      el.innerHTML =
        '<section class="hero">' +
          '<p class="kicker">Featured documentary</p>' +
          '<h1>' + escapeHtml(PLACEHOLDER_TITLE) + '</h1>' +
          '<p class="dek">' + escapeHtml(PLACEHOLDER_DEK) + '</p>' +
          '<div><span class="status-pill in_review">In review — not yet published</span></div>' +
          '<p class="byline">This documentary is still in editorial review. Check back soon.</p>' +
        '</section>';
      return;
    }
    var vres = await sb.from("editorial_versions")
      .select("html,version_number").eq("id", art.current_version_id).maybeSingle();
    if(vres.error) throw vres.error;
    el.innerHTML =
      '<div><span class="status-pill published">Published · approved ' + fmtDate(art.updated_at) +
      ' · v' + vres.data.version_number + '</span></div>' +
      vres.data.html;
  }catch(e){
    el.innerHTML = '<p class="msg err">Could not load the article: ' +
      escapeHtml((e && e.message) || String(e)) + '</p>';
  }
}

/* ================= Admin ================= */
var pollTimer = null;
var queueBusy = false;
function stopPoll(){ if(pollTimer){ clearInterval(pollTimer); pollTimer = null; } }

function renderAuthGate(){
  var el = document.getElementById("adminContent");
  el.innerHTML =
    '<div class="authbox">' +
      '<h3 class="serif">Editor sign-in</h3>' +
      '<p class="byline">Sign in with a magic link to review drafts.</p>' +
      '<div id="authMsg"></div>' +
      '<label for="authEmail">Email</label>' +
      '<input type="email" id="authEmail" value="' + EDITOR_EMAIL + '" autocomplete="email" inputmode="email">' +
      '<div class="actions"><button class="abtn primary" id="btnMagic">Email me a sign-in link</button></div>' +
      '<p class="hint">The link signs you in on this device. The redirect URL must be allowlisted in Supabase Auth → URL Configuration.</p>' +
    '</div>';
  document.getElementById("btnMagic").addEventListener("click", sendMagicLink);
}

async function sendMagicLink(){
  var email = document.getElementById("authEmail").value.trim();
  var msg = document.getElementById("authMsg");
  msg.innerHTML = '<p class="msg">Sending…</p>';
  try{
    var redirect = window.location.href.split("#")[0].split("?")[0];
    var res = await sb.auth.signInWithOtp({ email: email, options: { emailRedirectTo: redirect } });
    if(res.error) throw res.error;
    msg.innerHTML = '<p class="msg ok">Check your email for the sign-in link, then return here.</p>';
  }catch(e){
    msg.innerHTML = '<p class="msg err">' + escapeHtml((e && e.message) || String(e)) + '</p>';
  }
}

async function signOut(){
  stopPoll();
  await sb.auth.signOut();
  refreshAdmin();
}

function bindSignOut(){
  var b = document.getElementById("btnSignOut");
  if(b) b.addEventListener("click", signOut);
}

async function refreshAdmin(){
  var el = document.getElementById("adminContent");
  if(keyMissing){ el.innerHTML = configNeededHtml(); return; }
  var sessRes = await sb.auth.getSession();
  var sess = sessRes.data && sessRes.data.session;
  if(!sess){ stopPoll(); renderAuthGate(); return; }
  var email = (sess.user && sess.user.email) || "";
  if(email.toLowerCase() !== EDITOR_EMAIL.toLowerCase()){
    stopPoll();
    el.innerHTML =
      '<div class="authbox"><h3 class="serif">Not authorized</h3>' +
      '<p class="byline">Signed in as ' + escapeHtml(email) + ', which is not the editor account.</p>' +
      '<div class="actions"><button class="abtn" id="btnSignOut2">Sign out</button></div></div>';
    document.getElementById("btnSignOut2").addEventListener("click", signOut);
    return;
  }
  await renderQueue(email);
}

async function renderQueue(email){
  if(queueBusy) return;
  queueBusy = true;
  try{
    var el = document.getElementById("adminContent");
    var ar = await sb.from("editorial_articles")
      .select("id,slug,title,dek,status,current_version_id,updated_at")
      .order("updated_at",{ascending:false});
    if(ar.error) throw ar.error;
    var articles = ar.data || [];
    var ids = articles.map(function(a){ return a.id; });
    var verMap = {};
    if(ids.length){
      var vr = await sb.from("editorial_versions").select("article_id,version_number").in("article_id", ids);
      if(!vr.error){
        (vr.data || []).forEach(function(v){
          verMap[v.article_id] = Math.max(verMap[v.article_id] || 0, v.version_number);
        });
      }
    }

    var pending = articles.filter(function(a){ return a.status !== "published"; }).length;
    document.getElementById("queueCount").textContent = String(pending);

    var html =
      '<div class="authbox" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">' +
        '<span class="byline" style="margin:0">Signed in as <strong>' + escapeHtml(email) + '</strong></span>' +
        '<button class="abtn" id="btnSignOut" style="min-height:48px;width:auto;padding:8px 20px;font-size:15px">Sign out</button>' +
      '</div>';

    if(!articles.length){
      html += '<div class="card"><h2>No drafts yet</h2><p class="sub">New articles will appear here for review.</p></div>';
    }

    articles.forEach(function(a){
      var vn = verMap[a.id] || 0;
      var verLabel = a.status === "published" ? "Published · v" + vn : "Draft v" + vn;
      var canApprove = (a.status === "in_review" || a.status === "needs_revision");
      html +=
        '<div class="draft-card" data-id="' + a.id + '">' +
          '<h3 class="serif">' + escapeHtml(a.title) + '</h3>' +
          '<p class="draft-meta">' + escapeHtml(a.dek || "") + '</p>' +
          '<p>' + statusPill(a.status) + ' <span class="verlabel">' + escapeHtml(verLabel) + '</span></p>' +
          '<div data-role="cmsg"></div>' +
          '<div class="actions">' +
            '<button class="abtn" data-act="preview">Preview article</button>' +
            '<button class="abtn primary" data-act="approve"' + (canApprove ? "" : " disabled") + '>Approve &amp; publish</button>' +
          '</div>';
      if(a.status === "revising"){
        html +=
          '<p class="msg">Revision in progress — the writer is rewriting the draft. ' +
          'It will return to this queue automatically.</p>';
      }else{
        html +=
          '<div class="revbox">' +
            '<label>Revision notes for the writer</label>' +
            '<textarea class="notes" data-role="notes" placeholder="What needs to change before this can publish?"></textarea>' +
            '<div class="actions"><button class="abtn warn" data-act="revise">Revise article</button></div>' +
          '</div>';
      }
      html += '<div class="preview" data-role="preview" hidden></div></div>';
    });

    el.innerHTML = html;
    bindSignOut();

    el.querySelectorAll(".draft-card").forEach(function(card){
      var id = card.getAttribute("data-id");
      var art = articles.filter(function(x){ return x.id === id; })[0] || {};
      var cmsg = card.querySelector('[data-role="cmsg"]');
      function say(kind, text){
        cmsg.innerHTML = '<p class="msg ' + kind + '">' + escapeHtml(text) + '</p>';
      }

      var btnPrev = card.querySelector('[data-act="preview"]');
      var prevEl = card.querySelector('[data-role="preview"]');
      if(btnPrev) btnPrev.addEventListener("click", async function(){
        if(!prevEl.hidden){ prevEl.hidden = true; prevEl.innerHTML = ""; return; }
        prevEl.hidden = false;
        prevEl.innerHTML = '<p class="hint">Loading preview…</p>';
        try{
          if(!art.current_version_id) throw new Error("No version saved for this draft yet.");
          var r = await sb.from("editorial_versions")
            .select("html,version_number").eq("id", art.current_version_id).maybeSingle();
          if(r.error) throw r.error;
          prevEl.innerHTML = '<p><span class="status-pill in_review">Preview · v' +
            r.data.version_number + '</span></p>' + r.data.html;
          prevEl.scrollIntoView({behavior:"smooth", block:"start"});
        }catch(e){
          prevEl.innerHTML = '<p class="msg err">' + escapeHtml((e && e.message) || String(e)) + '</p>';
        }
      });

      var btnAppr = card.querySelector('[data-act="approve"]');
      if(btnAppr) btnAppr.addEventListener("click", async function(){
        btnAppr.disabled = true;
        try{
          var r = await sb.from("editorial_articles").update({ status: "published" }).eq("id", id);
          if(r.error) throw r.error;
          await renderQueue(email);
        }catch(e){
          say("err", (e && e.message) || String(e));
          btnAppr.disabled = false;
        }
      });

      var btnRev = card.querySelector('[data-act="revise"]');
      if(btnRev) btnRev.addEventListener("click", async function(){
        var notesEl = card.querySelector('[data-role="notes"]');
        var notes = notesEl ? notesEl.value.trim() : "";
        if(!notes){ say("err", "Write revision notes first — the writer needs to know what to change."); return; }
        btnRev.disabled = true;
        try{
          var ins = await sb.from("editorial_revision_requests")
            .insert({ article_id: id, notes: notes });
          if(ins.error) throw ins.error;
          var upd = await sb.from("editorial_articles").update({ status: "revising" }).eq("id", id);
          if(upd.error) throw upd.error;
          await renderQueue(email);
        }catch(e){
          say("err", (e && e.message) || String(e));
          btnRev.disabled = false;
        }
      });
    });

    // Keep the queue fresh while a revision is being written.
    stopPoll();
    if(articles.some(function(a){ return a.status === "revising"; })){
      pollTimer = setInterval(function(){ renderQueue(email); }, 20000);
    }
  }catch(e){
    document.getElementById("adminContent").innerHTML =
      '<p class="msg err">Could not load the queue: ' + escapeHtml((e && e.message) || String(e)) + '</p>';
  }finally{
    queueBusy = false;
  }
}

sb.auth.onAuthStateChange(function(){ refreshAdmin(); });

/* ================= Boot ================= */
loadReader();

})();
</script>
</body>
</html>
